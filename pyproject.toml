[project]
name = "oca-addons-repo-template"
version = "0.0.0"                            # Just a placeholder; the real version is the git tag
description = "Template for OBS addon repos"
authors = [{ name = "OBS Solutions B.V." }]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "copier>=9",
    "pytest",
    "pre-commit",
    "pytest-xdist",
]

# Not a distributable package, just a copier template with a dev toolchain
# (was poetry's `package-mode = false`).
[tool.uv]
package = false

# ruff

[tool.ruff]
fix = true

[tool.ruff.lint]
extend-select = [
    "UP", # pyupgrade
    "I",  # isort
]

# pytest (migrated from pytest.ini)

[tool.pytest.ini_options]
addopts = "-n auto -ra tests"
